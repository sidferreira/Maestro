name: Network Monitor Tests

on:
  push:
    paths:
      - 'maestro-network-monitor/**'
      - 'maestro-cli/src/main/java/maestro/cli/model/TestExecutionSummary.kt'
      - 'maestro-cli/src/main/java/maestro/cli/report/**'
      - '.github/workflows/network-monitor-test.yaml'
  pull_request:
    paths:
      - 'maestro-network-monitor/**'
      - 'maestro-cli/src/main/java/maestro/cli/model/TestExecutionSummary.kt'
      - 'maestro-cli/src/main/java/maestro/cli/report/**'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Run network monitor unit tests
        run: ./gradlew :maestro-network-monitor:test --no-daemon
      
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-monitor-test-reports
          path: maestro-network-monitor/build/reports/
          retention-days: 7
  
